# Release pipeline
#
# Trigger: push a tag `vX.Y.Z` (must match apps/desktop/package.json version).
# The easiest way to cut a release:
#
#   node scripts/release.mjs 0.2.0 --tag   # bump versions + commit + create tag v0.2.0
#   git push origin <branch> v0.2.0        # push → this workflow builds & publishes
#
# Builds installers for every platform defined in the electron-builder config
# (macOS dmg arm64, Windows NSIS x64, Linux AppImage/deb x64), each with its
# native pi-desktop-host-core Rust sidecar. Tags publish only the D010 macOS
# artifact; Windows/Linux stay downloadable CI readiness artifacts.

name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # macOS build is unsigned for now (identity: null); don't look for certs.
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  validate:
    name: Validate tag matches app version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Compare tag with apps/desktop/package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match apps/desktop/package.json version $APP_VERSION."
            echo "Run 'node scripts/release.mjs $TAG_VERSION --tag' to bump versions before tagging."
            exit 1
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            dist: dist:mac
          - name: Windows x64
            os: windows-latest
            dist: dist:win
          - name: Linux x64
            os: ubuntu-latest
            dist: dist:linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build:js

      - name: Package installers (${{ matrix.dist }})
        # The dist scripts pass --publish never themselves: electron-builder
        # must not self-publish on tag builds (no token; softprops owns it).
        run: pnpm --filter @pi-desktop/desktop run ${{ matrix.dist }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # D010 scope: only macOS ships from tag builds for now. The zip,
          # blockmap and latest-mac.yml are the electron-updater feed — the
          # update checker reads latest-mac.yml from the latest release.
          # Widen to dist/* once Windows/Linux are in scope.
          files: |
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/*-mac.zip
            dist/*-mac.zip.blockmap
            dist/latest-mac.yml
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
