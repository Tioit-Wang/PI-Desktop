# Temporary cross-repo smoke test.
#
# Proves the published action resolves from another repository and reaches the
# provider with this repository's own AIMOM_API_KEY. Uses the base action: no
# branch, no pull request, no repository writes.
name: pi-smoke

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  base-action:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Run pi-agent-action/base-action from another repository
        id: pi
        uses: Tioit-Wang/pi-agent-action/base-action@v1
        with:
          provider: deepseek
          model: deepseek-v4.1-flash
          base_url: https://platform.aimom.net/v1
          api_style: openai-completions
          api_key: ${{ secrets.AIMOM_API_KEY }}
          no_tools: "true"
          max_turns: "1"
          prompt: |
            Reply with the single word: ok

      - name: Assert the run succeeded
        env:
          CONCLUSION: ${{ steps.pi.outputs.conclusion }}
          SESSION_ID: ${{ steps.pi.outputs.session_id }}
          EXECUTION_FILE: ${{ steps.pi.outputs.execution_file }}
        run: |
          echo "conclusion=${CONCLUSION}"
          echo "session_id=${SESSION_ID}"
          echo "event lines: $(wc -l < "${EXECUTION_FILE}" 2>/dev/null || echo missing)"
          if [ "${CONCLUSION}" != "success" ]; then
            echo "::error::the pi run did not report success"
            exit 1
          fi
