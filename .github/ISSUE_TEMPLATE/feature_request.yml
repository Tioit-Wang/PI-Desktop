name: Feature request / 功能请求
description: Suggest an enhancement or ask a question. 建议新功能或提出问题。
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        功能请求 · Feature request
        请简洁清晰地描述，多谢！ Please keep it concise and clear.
  - type: textarea
    id: problem
    attributes:
      label: 问题 / Problem
      description: 你想解决什么问题？What do you want to achieve?
      placeholder: "…"
      render: markdown
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 方案 / Proposed solution
      description: 你期望的行为是怎样的？What behaviour do you expect?
      render: markdown
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 补充建议 / Notes
      description: 可选。Optional。
      render: markdown
  - type: textarea
    id: attachments
    attributes:
      label: 截图 / Screenshots
      description: 可拖拽图片。Drag & drop images here。
      placeholder: "![alt](url)"
      render: markdown