name: Bug report / Bug 反馈
description: Report something not working as expected. 报告产品行为异常。
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Bug 反馈 · Bug report
        请简短描述问题并提供复现步骤。Keep it short; include reproduction steps.
  - type: textarea
    id: description
    attributes:
      label: 问题描述 / Description
      description: 什么坏了、影响是什么？What is broken and its impact?
      render: markdown
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 从干净状态开始。From a clean state.
      placeholder: |-
        1. ...
        2. ...
      render: bash
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望 / Expected
      description: 应该发生什么。What should happen?
      render: markdown
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际 / Actual
      description: 实际发生了什么。What actually happened?
      render: markdown
    validations:
      required: true
  - type: checkboxes
    id: environment
    attributes:
      label: 环境 / Environment
      description: 可选。Optional。
      options:
        - label: "macOS (Apple Silicon)"
        - label: "Windows (x64)"
        - label: "Linux (x64)"
        - label: 最新发布版 / Latest release
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图 · Logs / screenshots
      description: 可选。Optional。
      render: shell